name: CI Code Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-js:
    name: Verify JavaScript & Electron Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check Electron and backend code
        run: |
          node -c main.js preload.js preload-picker.js
          node -c backend/server.js
          find backend/src -name "*.js" -exec node -c {} +
          echo "JavaScript code syntax is valid!"

  validate-firmware:
    name: Verify ESP32 Firmware Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Compile ESP32 firmware targets
        run: |
          pio run -e ESP32-2432S028 -e ESP32-2432S032 -d firmware
          echo "Firmware targets compiled successfully!"

  validate-android:
    name: Verify Android App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x App/android/gradlew

      - name: Compile Android Project
        run: |
          cd App/android
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3..."
            ./gradlew assembleDebug --no-daemon --stacktrace && break || {
              if [ $attempt -lt 3 ]; then
                echo "Build failed or network timeout, retrying in 10s..."
                sleep 10
              else
                echo "Build failed after 3 attempts."
                exit 1
              fi
            }
          done
          echo "Android application compiled successfully!"
