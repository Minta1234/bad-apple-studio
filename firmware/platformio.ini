; PlatformIO project — Bad Apple OLED/TFT player
; backend selects env via `pio run -e <env>` per job

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200

; ── OLED I2C displays (SSD1306 / SH1106) ── 128x64, B&W, U8g2
[env:esp32-oled096]
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DDISPLAY_W=128
    -DDISPLAY_H=64
    -DDISPLAY_DRIVER_SSD1306=1

[env:esp32-oled130]
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DDISPLAY_W=128
    -DDISPLAY_H=64
    -DDISPLAY_DRIVER_SH1106=1

; ── ESP32-2432S028 ("Cheap Yellow Display") ── ILI9341 TFT, 320x240, SPI, TFT_eSPI
[env:esp32-ili9341]
lib_deps =
    Bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DDISPLAY_W=320
    -DDISPLAY_H=240
    -DDISPLAY_DRIVER_ILI9341=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
