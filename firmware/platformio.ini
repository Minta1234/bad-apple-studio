; PlatformIO project — Bad Apple OLED/TFT player
; backend selects env via `pio run -e <env>` per job

[env]
platform = espressif32@^6.7.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200

; ── OLED I2C displays (SSD1306 / SH1106) ── 128x64, B&W, U8g2
[env:esp32-oled096]
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DDISPLAY_W=128
    -DDISPLAY_H=64
    -DDISPLAY_DRIVER_SSD1306=1

[env:esp32-oled130]
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DDISPLAY_W=128
    -DDISPLAY_H=64
    -DDISPLAY_DRIVER_SH1106=1


; ── ESP32 + 1.9" ST7789V (170x320, SPI) ──────────────────────────────────────
[env:esp32-st7789-19]
lib_deps =
    Bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DDISPLAY_W=170
    -DDISPLAY_H=320
    -DDISPLAY_DRIVER_TFT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=5
    -DSPI_FREQUENCY=40000000

; ── ESP32-S3 Super Mini + 1.9" ST7789V (170x320, SPI) ────────────────────────
[env:esp32s3mini-st7789-19]
board = esp32-s3-devkitc-1
lib_deps =
    Bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DDISPLAY_W=170
    -DDISPLAY_H=320
    -DDISPLAY_DRIVER_TFT=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=4
    -DTFT_RST=5
    -DTFT_BL=6
    -DSPI_FREQUENCY=40000000



; ── ESP32-2432S032 ("Cheap Yellow Display" 3.2") ── ST7789, 320x240, SPI
[env:ESP32-2432S032]
lib_deps =
    Bodmer/TFT_eSPI@^2.5.43
build_flags =
    -DHAS_SD_CARD=1
    -DHAS_BLE=1
    -DDISPLAY_W=320
    -DDISPLAY_H=240
    -DDISPLAY_DRIVER_ST7789=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    
