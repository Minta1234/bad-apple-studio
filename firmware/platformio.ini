; PlatformIO project — Bad Apple OLED player
; สองบอร์ด env แยกตามชิปจอ (ความละเอียดเท่ากันทั้งคู่: 128x64)
; backend เลือก env ผ่าน `pio run -e <env>` ต่อ job

[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19
build_flags =
    -DDISPLAY_W=128
    -DDISPLAY_H=64

[env:esp32-oled096]
build_flags =
    ${env.build_flags}
    -DDISPLAY_DRIVER_SSD1306=1

[env:esp32-oled130]
build_flags =
    ${env.build_flags}
    -DDISPLAY_DRIVER_SH1106=1
