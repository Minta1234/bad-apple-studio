; ── ESP32-4827S043 (4.3") ── RGB Panel, 480x272, ESP32-S3
[env:ESP32-4827S043]
board = esp32s3box
board_build.arduino.memory_type = qio_opi
lib_deps =
    moononournation/GFX Library for Arduino@1.4.9
build_flags =
    -DBOARD_HAS_PSRAM
    -DHAS_SD_CARD=1
    -DHAS_BLE=1
    -DDISPLAY_W=480
    -DDISPLAY_H=272
    -DDISPLAY_DRIVER_ARDUINO_GFX=1
    -DGFX_PANEL_4827S043=1

